<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217" />
      <stop offset="50%" stop-color="#141A22" />
      <stop offset="100%" stop-color="#0A0D12" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glow-blue" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3568E8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3568E8" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="glow-green" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>

    <filter id="card-shadow" x="-10" y="-10" width="1220" height="380" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Canvas with Border -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow-blue)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow-green)" />
  <rect x="1" y="1" width="1198" height="358" rx="15" stroke="#252D3A" stroke-width="1.5" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Central Visual Container -->
  <g transform="translate(80, 55)">
    <!-- Logo Monogram -->
    <g transform="translate(0, 10)">
      <rect width="84" height="84" rx="20" fill="url(#logo-grad)" />
      <rect x="0.5" y="0.5" width="83" height="83" rx="19.5" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.4" />
      <path d="M42 20L22 62H33L37.5 52H46.5L51 62H62L42 20ZM42 34L44.8 44H39.2L42 34Z" fill="#FFFFFF" />
      <!-- Pulsing Node Dot -->
      <circle cx="68" cy="18" r="6" fill="#10B981" />
      <circle cx="68" cy="18" r="10" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />
    </g>

    <!-- Main Title & Tagline -->
    <g transform="translate(110, 10)">
      <!-- Status Pill -->
      <g transform="translate(0, 0)">
        <rect width="210" height="26" rx="13" fill="#1E293B" fill-opacity="0.7" stroke="url(#badge-border)" stroke-width="1" />
        <circle cx="12" cy="13" r="4" fill="#38BDF8" />
        <text x="24" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">NEXT.JS 15 • SAAS PLATFORM</text>
      </g>

      <!-- Main Headline -->
      <text x="0" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">AgencyOS</text>
      <text x="215" y="66" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="300" letter-spacing="-0.5">.ai</text>

      <!-- Subtitle -->
      <text x="0" y="98" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
        Autonomous Agency Operating System for Productized Web Agencies &amp; Founders
      </text>

      <text x="0" y="122" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">
        Automate discovery, audits, outreach, proposals &amp; client handoffs with deterministic AI workflows.
      </text>
    </g>

    <!-- Feature Pillars Badges Bar -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="230" height="42" rx="10" fill="#151C26" stroke="#2D3748" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#3B82F6" />
        <text x="36" y="25" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Lead Intelligence &amp; Audits</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(245, 0)">
        <rect width="230" height="42" rx="10" fill="#151C26" stroke="#2D3748" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#10B981" />
        <text x="36" y="25" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Autonomous AI Agents</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(490, 0)">
        <rect width="240" height="42" rx="10" fill="#151C26" stroke="#2D3748" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#8B5CF6" />
        <text x="36" y="25" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Outreach &amp; Sequence Builder</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(745, 0)">
        <rect width="250" height="42" rx="10" fill="#151C26" stroke="#2D3748" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#F59E0B" />
        <text x="36" y="25" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Client CRM &amp; Project Delivery</text>
      </g>
    </g>
  </g>
</svg>

