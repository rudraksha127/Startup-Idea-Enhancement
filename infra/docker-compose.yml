services:
  agencyos-web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agencyos-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    networks:
      - agencyos-network

  agencyos-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: agencyos-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=change-this-to-a-very-secure-32-byte-hex-secret
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - CATALYST_PROJECT_ID=agencyos-prod
      - CATALYST_ENVIRONMENT=production
    networks:
      - agencyos-network

networks:
  agencyos-network:
    driver: bridge
